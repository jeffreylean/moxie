[package]
name = "moxie"
description = "An editor for the MotionGfx framework."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "./README.md"

[dependencies]
bevy_motiongfx = { workspace = true }
motiongfx_scene = { workspace = true }
moxie_ui = { workspace = true }
moxie_asset = { workspace = true }
bevy_fynix = { workspace = true }
fynix = { workspace = true }
bevy = { workspace = true, default-features = true, features = [
    "bevy_feathers",
    "bevy_ui_widgets",
    "bevy_settings",
    "scene",
    "serialize",
] }
rfd = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }

[lints]
workspace = true
